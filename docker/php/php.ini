; Dev defaults. Azure uses the same file with environment-specific overrides.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_vars = 5000
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Bind mount: re-check files on every request so edits show at once.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
